# Runs the fast half of CI before a commit is made, so the slow half is not
# spent finding a missing newline. Install with:
#
#     pip install pre-commit && pre-commit install
#
# The test suite is deliberately not here: thirteen seconds is too long for a
# commit hook, and `make check` or CI covers it.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        # Formatting is not enforced in CI, so this only reformats what it is
        # given rather than failing on the rest of the tree.
        stages: [manual]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        # The 15MB source PDF is already committed; this stops the next one.
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
