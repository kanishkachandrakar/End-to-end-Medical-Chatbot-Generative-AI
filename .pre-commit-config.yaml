# Runs the fast half of CI before a commit is made, so the slow half is not
# spent finding a missing newline. Install with:
#
#     pip install pre-commit && pre-commit install
#
# The test suite is deliberately not here: thirteen seconds is too long for a
# commit hook, and `make check` or CI covers it.
repos:
  # ruff runs from the environment rather than a pinned mirror, so the hook and
  # CI cannot disagree about what passes. The mirror's rev was v0.9.6 against
  # 0.16 everywhere else, which meant the hook could pass code CI rejects.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
        require_serial: true

  # The one check where "at commit time" is the whole value: a key in a local
  # commit is in that history permanently, and removing it in the next commit
  # does not remove it from the one before. CI catching it is catching it after
  # the fact. detect-private-key below covers SSH and PEM keys, not the API key
  # prefixes this project actually leaked.
  - repo: local
    hooks:
      - id: no-api-keys
        name: no api keys
        entry: python scripts/check_no_keys.py
        language: system
        types: [text]
        require_serial: true

  # A notebook is one JSON document, and the scripts in this history have
  # corrupted it more than once by editing it as text. check-json does not
  # cover .ipynb, so this does.
  - repo: local
    hooks:
      - id: notebook-json
        name: notebook json
        entry: python -c "import json,sys; [json.load(open(p)) for p in sys.argv[1:]]"
        language: system
        files: \.ipynb$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        # The 15MB source PDF is already committed; this stops the next one.
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
