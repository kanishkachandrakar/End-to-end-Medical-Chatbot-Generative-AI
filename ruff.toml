# Ruff's defaults plus import sorting. Line length matches the 88 columns the
# codebase already wraps at.
line-length = 88
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "UP", "B"]

[lint.per-file-ignores]
# The notebook's prototype code is kept as a record of how the pipeline was
# built; it is not maintained to the same standard as src/.
"research/*" = ["ALL"]
