name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # Only the dev requirements: the suite is designed to run without the
      # embedding model, a Pinecone key or a network call, so there is no need
      # to install torch here.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest

      # Catches a syntax error in a module the unit tests do not import.
      - name: Byte-compile every module
        run: python -m compileall -q app.py store_index.py template.py setup.py src

      - name: Validate the Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          call: check
