name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. The default token can write to the repository, and nothing
# here needs to: no job pushes a commit, publishes a package or edits an issue.
# Set at the top level so a job added later inherits it rather than the default.
permissions:
  contents: read

# Several commits land in quick succession here; only the newest is worth
# running, and a superseded run's red cross is just noise.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit SHA, with the version in the comment beside it.
# A major tag like @v5 is mutable: whoever publishes the action can move it,
# and these run in CI with a token. The Dockerfile's base image is pinned by
# digest for the same reason and says so in the same words -- "so the base is
# identical on every build" -- so leaving five actions on moving tags was the
# supply-chain section of SECURITY.md applying to one half of the build.
# Dependabot reads this format and proposes the SHA bumps.
jobs:
  check:
    runs-on: ubuntu-latest
    # The suite is five seconds and the install a minute or two. Ten is
    # generous; without it a hung job occupies a runner for six hours, which
    # is the default and has already nearly happened once when a job sat
    # queued and was cancelled rather than run.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the Dockerfile and setup.py's python_requires target, so
        # it is the version that has to pass. 3.13 is the other end of the
        # supported range rather than a choice: langchain-pinecone declares
        # requires_python <3.14, so 3.13 is the newest interpreter this project
        # can install on at all.
        python-version: ["3.12", "3.13"]
    steps:
      # persist-credentials: false -- checkout writes the job's token into
      # .git/config by default, where every later step can read it. Nothing
      # here pushes: the token is wanted for the clone and nothing after it.
      # It is read-only already, because permissions is contents: read at the
      # top of this file, so this is the second lock rather than the first.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Only the dev requirements: the suite is designed to run without the
      # embedding model, a Pinecone key or a network call, so there is no need
      # to install torch here.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # The hooks are the cheap checks -- trailing whitespace, a missing final
      # newline, a committed private key, a file over 1MB. They only matter if
      # something runs them, and nothing requires a contributor to install the
      # hook, so CI does. ruff is excluded because the step above already ran
      # it against the whole tree.
      # The hooks build their own environments on first run, which is most of
      # the step's time. Keyed on the config, so it is rebuilt when a hook
      # version changes and reused otherwise.
      - name: Cache the pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ matrix.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit hooks
        run: SKIP=ruff pre-commit run --all-files --show-diff-on-failure

      # The floor belongs here rather than in pytest.ini: it is only
      # meaningful across the whole suite, which is what CI runs.
      - name: Type-check
        run: mypy src app.py store_index.py template.py setup.py
          gunicorn.conf.py scripts/check_no_keys.py

      # COVERAGE_CORE picks sys.monitoring. Under the default tracer coverage
      # spends about fourteen seconds tracing the langchain import tree it then
      # discards; sysmon does the same job in one. Every version in the matrix
      # has sys.monitoring now, so there is nothing to choose between -- this
      # was a conditional handing 3.10 the C tracer by name, and 3.10 is gone.
      # The Makefile still computes it, because a local interpreter may be
      # older than anything tested here.
      - name: Test
        env:
          COVERAGE_CORE: sysmon
        run: python -m pytest --cov --cov-fail-under=95

      # Catches a syntax error in a module the unit tests do not import.
      - name: Byte-compile every module
        run: python -m compileall -q app.py store_index.py template.py
          setup.py gunicorn.conf.py scripts/check_no_keys.py src

      # Neither of these files is Python, so nothing above looks at them:
      # static/chat.js is the whole chat UI and scripts/deploy_space.sh is how
      # the Space gets updated. A syntax error in either is silent until use.
      - name: Check the JavaScript parses
        run: node --check static/chat.js

      - name: Check the shell script
        run: |
          bash -n scripts/deploy_space.sh
          # --severity=error only: style findings should not fail a build that
          # nobody has had the chance to read yet.
          shellcheck --severity=error scripts/deploy_space.sh

      - name: Validate the Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          call: check

  # Separate job: this one takes minutes rather than seconds, and a lint or
  # test failure should not wait on it. It is the only check that proves the
  # image a Space would build actually builds.
  image:
    runs-on: ubuntu-latest
    # Builds the torch layer from scratch when the cache misses, which is the
    # slow case worth allowing for.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Without a cache every run re-downloads the torch wheel and the model
      # weights, which is most of the build time. gha scopes the cache per
      # branch and falls back to main's.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: medibot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The tag in `FROM python:3.12-slim@sha256:...` is decoration -- docker
      # resolves the digest and ignores the rest of it. So the two can say
      # different things, and nothing would notice: the image would run an
      # interpreter the Dockerfile does not name, the matrix does not test,
      # and python_requires may not allow. Both halves of that line were
      # typed by hand the day the floor moved off end-of-life 3.10.
      - name: The pinned digest is the version the tag claims
        run: |
          pin=$(grep -oE 'python:3\.[0-9]+-slim@sha256:[0-9a-f]+' Dockerfile)
          test -n "$pin" || { echo "::error::no digest-pinned python base found"; exit 1; }
          claimed=$(printf '%s' "$pin" | sed -E 's/^python:([0-9]+\.[0-9]+)-slim@.*/\1/')
          actual=$(docker run --rm --entrypoint python medibot:ci -c \
            "import sys; print('%d.%d' % sys.version_info[:2])")
          printf 'tag claims %s, image runs %s\n' "$claimed" "$actual"
          if [ "$claimed" != "$actual" ]; then
            echo "::error::the tag says $claimed and the pinned digest is $actual"
            exit 1
          fi

      # The CPU wheel is about a fifth the size of the CUDA one, and the way
      # that regresses is silent: a dependency pulling plain `torch` from PyPI
      # builds fine and works fine, just four times larger and far slower to
      # deploy. 1GB, measured: the image is 526MB on the 3.12 base, with the
      # CPU torch wheel and the model weights baked in. The budget was 3GB,
      # set when the image was 2.3GB -- and after it dropped to 526MB, a CUDA
      # torch could have come back and landed near 3GB without tripping it.
      # A guard calibrated against an image four times larger is not a guard.
      - name: Guard the image size
        run: |
          bytes=$(docker image inspect medibot:ci --format '{{.Size}}')
          budget=$((1 * 1024 * 1024 * 1024))
          printf 'image is %s MB, budget %s MB\n' "$((bytes / 1024 / 1024))" "$((budget / 1024 / 1024))"
          if [ "$bytes" -gt "$budget" ]; then
            echo "::error::the image has grown past its budget -- is a CUDA torch back?"
            exit 1
          fi

      # Everything else about the image is checked statically. This runs the
      # real Flask app out of the real image and asks it for a page: it needs
      # no keys, because create_app() takes the chain as an argument.
      # -W error here too: this is the Flask and langchain-pinecone import path
      # inside the image, and a deprecation on it is the same early warning the
      # dimension check watches for on the model path.
      - name: Check the app inside the image can serve a request
        run: |
          docker run --rm --entrypoint python medibot:ci -W error -c "
          from src.webapp import create_app

          class Chain:
              def invoke(self, payload):
                  return {'answer': 'a stubbed answer'}

          client = create_app(Chain()).test_client()
          health = client.get('/healthz')
          assert health.status_code == 200, health.status_code
          page = client.get('/')
          assert page.status_code == 200 and b'messageArea' in page.data
          answer = client.post('/get', data={'msg': 'what is acne?'})
          assert answer.data == b'a stubbed answer', answer.data
          assert answer.mimetype == 'text/plain'
          print('image serves /, /healthz and /get')
          "

      # The only check that starts the container the way a host does: gunicorn,
      # its config, and app:create() resolving to a callable factory. None of
      # that is exercised by running python inside the image.
      #
      # It needs no real credentials because create() degrades rather than
      # raising when the chain cannot be built -- so a container with junk keys
      # still binds the port and answers /healthz, with 503 and the reason.
      # The other way a Space comes up wrong, and the likelier one: the two
      # secrets were never set. That used to kill the worker and crash-loop
      # the container; it now serves and says keys-missing at /healthz. Tested
      # here because the suite can only reach it through Flask's test client,
      # and what matters is that gunicorn starts at all with no credentials.
      - name: Boot the container with no credentials at all
        run: |
          docker run -d --name medibot-nokeys -p 7861:7860 medibot:ci

          for attempt in $(seq 1 30); do
            code=$(curl -s -o /tmp/nokeys -w '%{http_code}' \
              http://127.0.0.1:7861/healthz || true)
            case "$code" in
              200|503) break ;;
            esac
            sleep 2
          done
          body=$(cat /tmp/nokeys 2>/dev/null || true)
          live=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:7861/livez || true)
          printf 'healthz %s: %s\n' "$code" "$body"
          printf 'livez   %s\n' "$live"
          docker logs medibot-nokeys 2>&1 | tail -5
          docker rm -f medibot-nokeys >/dev/null

          if [ "$code" != "503" ] || ! printf '%s' "$body" | grep -q keys-missing; then
            echo "::error::with no secrets set, /healthz must answer 503 keys-missing"
            exit 1
          fi
          # A restart cannot set a secret, so liveness must not invite one.
          if [ "$live" != "200" ]; then
            echo "::error::/livez answered $live with no secrets; it must be 200"
            exit 1
          fi

      - name: Boot the container and ask it for /healthz
        run: |
          docker run -d --name medibot-boot -p 7860:7860 \
            -e PINECONE_API_KEY=not-a-real-key \
            -e GROQ_API_KEY=not-a-real-key \
            medibot:ci

          for attempt in $(seq 1 30); do
            code=$(curl -s -o /tmp/healthz -w '%{http_code}' http://127.0.0.1:7860/healthz || true)
            case "$code" in
              200|503) echo "answered $code: $(cat /tmp/healthz)"; break ;;
            esac
            sleep 2
          done

          # /livez is what the container's own HEALTHCHECK calls, so it has
          # to answer too -- and it must answer 200 even when /healthz is
          # reporting 503, which is the whole point of the two being separate.
          live=$(curl -s -o /tmp/livez -w '%{http_code}' http://127.0.0.1:7860/livez || true)
          echo "livez answered $live: $(cat /tmp/livez 2>/dev/null)"

          # Docker runs the HEALTHCHECK itself; this is the only check that
          # the command inside it actually works.
          for attempt in $(seq 1 20); do
            health=$(docker inspect --format '{{.State.Health.Status}}' medibot-boot 2>/dev/null || echo none)
            [ "$health" = "starting" ] || break
            sleep 3
          done
          echo "container health: $health"

          docker logs medibot-boot
          docker rm -f medibot-boot >/dev/null

          if [ "$live" != "200" ]; then
            echo "::error::/livez answered $live, but liveness must always be 200"
            exit 1
          fi
          if [ "$health" != "healthy" ]; then
            echo "::error::the container reports health '$health'; the HEALTHCHECK command is wrong"
            exit 1
          fi

          case "$code" in
            200|503) ;;
            *) echo "::error::the container never answered /healthz (last: ${code:-none})"
               exit 1 ;;
          esac

      # Proves the entrypoint resolves and gunicorn can parse its config,
      # without needing API keys: app:app is only imported by a real worker.
      - name: Check the container's gunicorn config
        run: |
          docker run --rm --entrypoint python medibot:ci -c "
          import importlib.util
          spec = importlib.util.spec_from_file_location('g', 'gunicorn.conf.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          print('bind:', mod.bind, 'workers:', mod.workers)
          assert mod.bind.endswith(':7860')
          "

      # The one check the unit suite cannot make: it never loads the model, so
      # nothing else would notice an embedding library upgrade changing the
      # output size -- which silently invalidates every vector in the index,
      # since Pinecone rejects upserts of the wrong dimension and retrieval
      # returns nothing. The image has torch and the weights already.
      # -W error applies to the one code path the unit suite cannot reach:
      # constructing the embedding model. The suite treats warnings as errors
      # but never builds this, so a deprecation here -- the exact signal that
      # langchain-community's sunset gave -- would otherwise be printed into a
      # build log and scrolled past.
      - name: Check the embedding dimension still matches the index
        run: |
          docker run --rm --entrypoint python medibot:ci -W error -c "
          from src.config import EMBED_DIM, EMBED_MODEL
          from src.helper import download_hugging_face_embeddings
          vector = download_hugging_face_embeddings().embed_query('hypertension')
          print(f'{EMBED_MODEL} -> {len(vector)} dimensions, expected {EMBED_DIM}')
          # DEPLOY.md tells a reader this peaks around 530MB, which is what
          # decides whether a 512MB host can run it at all. A documented
          # number nothing measures is a number that drifts, and this is the
          # one place the real model is ever loaded.
          import resource
          peak = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss / 1024
          print(f'peak resident memory {peak:.0f} MB')
          assert peak < 700, (
              f'the model now peaks at {peak:.0f}MB; DEPLOY.md says about 530 '
              'and uses it to say which hosts can run this'
          )
          assert len(vector) == EMBED_DIM, (
              f'{EMBED_MODEL} now returns {len(vector)} dimensions, not {EMBED_DIM}: '
              'the existing Pinecone index cannot be used with it'
          )
          "

      # The weights are baked in at build time; if that layer silently stopped
      # working, every cold start would begin with a 90MB download instead.
      - name: Check the embedding weights are in the image
        run: |
          docker run --rm --entrypoint python medibot:ci -c "
          import pathlib, os
          cache = pathlib.Path(os.environ['HF_HOME'])
          files = list(cache.rglob('*.safetensors')) + list(cache.rglob('*.bin'))
          assert files, f'no model weights under {cache}'
          print('cached weights:', [f.name for f in files][:5])
          "
