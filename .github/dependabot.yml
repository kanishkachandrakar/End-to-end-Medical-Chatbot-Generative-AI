version: 2
updates:
  # The pins that matter here are the ones that broke a build before:
  # sentence-transformers against huggingface_hub, and the langchain split
  # across langchain / langchain-community / langchain-core.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      langchain:
        patterns:
          - "langchain*"
    # Two updates cannot be taken, and the reason is upstream rather than a
    # preference here. Left unignored they are reopened on every release and
    # fail CI every time, which trains everyone to stop reading dependabot.
    ignore:
      # langchain-pinecone 0.2.13 -- its latest -- requires
      # pinecone[asyncio]<8.0.0,>=6.0.0. A pinecone 8+ bump cannot resolve
      # while langchain-pinecone is a dependency; pip does not say so, it
      # just backtracks to 7.x quietly. Drop this when that ceiling moves.
      - dependency-name: "pinecone"
        versions: [">=8"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # The Dockerfile pins its base image by digest, which is only tolerable if
  # something proposes the updates -- otherwise the pin freezes the base at
  # whatever Debian and CPython patch level it was cut on. This is that
  # something; without it the pin is a liability rather than a safeguard.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Same ceiling, one step removed: langchain-pinecone declares
      # requires_python <3.14, so the image cannot be built on 3.14 or 3.15 --
      # the dev requirements do not resolve there at all. The 3.15-slim PR was
      # proposed, failed the check that the base image must be a version the
      # matrix tests, and would fail again on every October release.
      - dependency-name: "python"
        versions: [">=3.14"]
