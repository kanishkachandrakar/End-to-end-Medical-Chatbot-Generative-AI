version: 2
updates:
  # The pins that matter here are the ones that broke a build before:
  # sentence-transformers against huggingface_hub, and the langchain split
  # across langchain / langchain-community / langchain-core.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      langchain:
        patterns:
          - "langchain*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # The Dockerfile pins its base image by digest, which is only tolerable if
  # something proposes the updates -- otherwise the pin freezes the base at
  # whatever Debian and CPython patch level it was cut on. This is that
  # something; without it the pin is a liability rather than a safeguard.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
