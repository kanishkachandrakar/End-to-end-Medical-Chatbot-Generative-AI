[pytest]
testpaths = tests
# Keep the suite fast and hermetic: it must not need API keys, a network
# connection or the embedding model. Anything that would is not a unit test.
# Coverage is reported locally but not enforced: the floor only makes sense
# over the whole suite, and failing `pytest tests/test_one_thing.py` for
# 0% coverage makes the normal way of working unusable. CI enforces it.
addopts = -q --strict-markers --cov

# Importing langchain_community costs about ten seconds, which is more than the
# rest of the suite put together. The tests that need it are marked so local
# runs can skip them with -m "not slow"; CI runs everything.
markers =
    slow: needs a heavyweight import (langchain_community)
