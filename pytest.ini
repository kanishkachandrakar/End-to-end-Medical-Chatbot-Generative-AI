[pytest]
testpaths = tests
# Keep the suite fast and hermetic: it must not need API keys, a network
# connection or the embedding model. Anything that would is not a unit test.
# The floor is set just under the current figure, so a real regression fails
# but an added line does not have to be covered on the same commit.
addopts = -q --strict-markers --cov --cov-fail-under=95
