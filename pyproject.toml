[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Packaging metadata stays in setup.py: requirements.txt ends with "-e ." purely
# to put src/ on the path, and moving that is a change to how the image installs
# rather than a tidy-up.

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
# RUF100 on its own, not the whole RUF set: a `# noqa` for a rule nothing runs
# reads as "a linter objects here and we decided it is fine" when no linter
# objects -- and if that rule is ever selected, the suppression applies without
# anyone reviewing it. There were seven, for BLE001, N802 and S324, none of
# them enabled; one was mine, added an hour before this and already redundant
# because usedforsecurity=False satisfies S324 on its own.
# FBT002/FBT001 as well: prepare_index took `recreate` and `yes` positionally,
# and those two differ by whether a destructive delete is confirmed before it
# happens. Argument order is a poor place to keep that.
extend-select = ["E111", "E117", "RUF100", "FBT"]
# "E" reads as all of pycodestyle and is not: ruff keeps the indentation rules
# behind preview, so E111 and E117 were selected and never ran. template.py was
# indented three spaces throughout -- against this repo's own .editorconfig,
# which declares four for Python -- and eleven violations sat in a file every
# check claimed to cover.
#
# Naming them is not enough: preview has to be on for ruff to run them at all,
# and preview also widens the rules already selected -- it brought four
# blank-line findings in src/webapp.py and tests/ with it, all fair and all
# auto-fixed. So this is not two extra rules, it is pycodestyle as ruff
# currently implements it, which is what "E" was always meant to mean here.
preview = true

[tool.ruff.lint.per-file-ignores]
# The suite is assertions, subprocess calls to git and bash, and a couple of
# 0.0.0.0 literals it checks the app does *not* bind. Every S rule that fires
# there fires on the thing the test is for.
"tests/*" = ["S"]
# The notebook's prototype code is kept as a record of how the pipeline was
# built; it is not maintained to the same standard as src/.
"research/*" = ["ALL"]

[tool.mypy]
python_version = "3.12"
# strict, which found fourteen gaps the four warnings below did not. The two
# worth naming: TokenBucket took an unannotated clock, so every float derived
# from it was an Any and the `-> float` on tokens_available and seconds_until
# was declared and never checked; and seven functions across store_index.py,
# middleware.py and app.py had no parameter or return annotations at all, in a
# project that annotates everything else.
strict = true
# Most of the dependency tree ships no stubs; checking our own annotations is
# the point, not re-typing langchain.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# No --cov here, which is not an oversight. pytest-cov's --cov takes an optional
# value, so a bare --cov in addopts eats the first positional argument: running
# `pytest tests/test_one_thing.py` became `--cov=tests/test_one_thing.py` with no
# path left, so pytest fell back to testpaths and ran all 490 tests while
# measuring a file coverage reported as "never imported" -- 22 seconds and no
# report, instead of 0.4 seconds and no report. The flag belongs on the two
# invocations that want a report, `make test` and the CI step, where the next
# argument is another option and cannot be swallowed.
addopts = "-q --strict-markers"
markers = [
    # Slow for a reason that is not the code under test: a heavyweight import,
    # real git work in a temporary repository, or a pytest subprocess. It said
    # "needs a heavyweight import (langchain_community)", which was already
    # untrue of one of its three users -- test_deploy_script.py clones and
    # commits -- and `make fast` is only a useful number if the marker means
    # "slow", not "imports one particular package".
    "slow: slow for a reason other than the code under test",
]

# A warning is how a library announces a move before it makes one, and this
# project has been broken twice by a move it was not watching for: langchain
# 1.0 relocating create_retrieval_chain, and pip resolving langchain-pinecone
# back to a release predating the class app.py imports. Both would have been
# a DeprecationWarning first, in a summary nobody reads.
filterwarnings = [
    "error",
    # langchain-community is sunset and says so on import. src/loaders.py is
    # the only thing that still imports it, deliberately -- see the note
    # there -- so the announcement is acknowledged rather than acted on daily.
    "default:`langchain-community` is being sunset:DeprecationWarning",
]

[tool.coverage.run]
# Every module this project ships, except the three named below. app.py joined
# when create() made it importable without keys; store_index.py was simply
# never listed, so its 99 statements -- the largest file outside src/ -- were
# covered by the tests and invisible to the gate.
#
# Not measured, and each for a reason rather than by omission:
#
#   gunicorn.conf.py  Its name is not an importable module name, so coverage
#                     cannot take it as a source entry -- a path there collects
#                     nothing and warns. tests/test_deploy_config.py executes
#                     it and asserts its settings instead.
#   setup.py          Run by pip, never by this project.
#   template.py       A one-shot scaffold whose job finished before the first
#                     commit; running it again is a no-op by design.
#   scripts/check_no_keys.py
#                     A pre-commit hook. The suite drives it as a subprocess
#                     and loads it by path for its patterns, but adding
#                     scripts/ to the source would mix a dev tool's lines into
#                     a figure that describes the shipped app.
#
# tests/test_coverage_scope.py holds that list to being complete, so the next
# module cannot go unmeasured the way store_index.py did.
source = ["src", "app", "store_index"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    # Only runs under `python app.py`, which is the development server.
    'if __name__ == .__main__.:',
    "^\\s*\\.\\.\\.$",
    # Constructing HuggingFaceEmbeddings loads torch and downloads weights;
    # CI installs neither, by design.
    "def download_hugging_face_embeddings",
]
